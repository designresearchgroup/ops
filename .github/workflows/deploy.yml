name: Deploy to GoDaddy

# Manual-only for now: run from the Actions tab (workflow_dispatch) once the
# FTP secrets are set. Push-triggered deploy is disabled so commits don't fail.
# To re-enable auto-deploy on push, uncomment the `push:` block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['ops/**', '.github/workflows/deploy.yml']

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync ops/ to GoDaddy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}     # e.g. ftp.jamesecoleman.com
          username: ${{ secrets.FTP_USERNAME }}    # full cPanel/FTP user
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./ops/
          server-dir: /public_html/ops/            # adjust if your web root differs
          # Never touch the server-side secret, and don't upload samples/vcs noise.
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/*.sample.php
            **/.DS_Store
